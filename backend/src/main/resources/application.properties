# ============================================================================
# BRAINSERVE APPOINTMENT SERVICE - MAIN CONFIGURATION
# Edit this file to connect your PostgreSQL, Redis, Kafka, mail and S3 services.
# The defaults below target services installed directly on the same laptop.
# Docker Compose overrides the service addresses automatically.
# Never commit real production passwords or encryption keys to GitHub.
# ============================================================================

# Application and server
spring.application.name=brainserve-appointment-service
brainserve.frontend.public-url=http://localhost:5173

server.port=8080
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# PostgreSQL - change these three values for your own database
spring.datasource.url=jdbc:postgresql://localhost:5432/brainserve
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=30000

# JPA and Flyway
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=BrainServe_Redis@2026
spring.data.redis.timeout=2s

# Kafka - internal staff call/message delivery
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=brainserve.internal-calls.v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.brainserve.appointment.notification.api
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.admin.fail-fast=false
brainserve.notification.internal-call-topic=brainserve.internal-calls.v1
brainserve.notification.internal-call-dispatch-ms=1000
brainserve.notification.internal-call-retry-seconds=30

## Email / SMTP
#spring.mail.host=${MAIL_HOST:localhost}
