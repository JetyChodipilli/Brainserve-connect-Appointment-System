# Local SMTP using Mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# JSON and file upload limits
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Authentication and encryption - required before startup; never commit real values
brainserve.security.jwt-secret=YxJ3u9vP2Lq7RmK5dF8nC4sW6aT1eH0bGzUoXiNkQpE=
brainserve.security.pii-encryption-key=K8mV4zQ1cN7yB2pR9xD5fW0uL6sA3hTjEoGiUkXnZqM=
brainserve.security.access-token-minutes=15
brainserve.security.refresh-token-days=14
brainserve.security.password-change-otp-minutes=10
brainserve.security.account-recovery-code-minutes=30
brainserve.security.account-archive-otp-minutes=10
brainserve.security.account-archive-otp-resend-seconds=60
brainserve.security.account-archive-otp-max-attempts=5
brainserve.security.admin-password-verification-lock-minutes=15
brainserve.security.allowed-origins=http://localhost:5173

# Official staff login policy
# CEO, HR and reception login emails must end with this company domain.
brainserve.identity.company-email-domain=brainserve.in
brainserve.bootstrap.system-admin-email=jetychodipilli@gmail.com
# One inbuilt System Admin account: jetychodipilli@gmail.com
# Required on the first startup. The value is stored only as a BCrypt hash and
# must be supplied through the environment or a Git-ignored local profile.
brainserve.bootstrap.system-admin-password=SystemAdmin@BrainServe#06
brainserve.bootstrap.system-admin-enabled=true
# One idempotent CEO seed. If any CEO account already exists, these values are not used
# and the existing active CEO is linked to the appointment host directory instead.
brainserve.bootstrap.ceo-enabled=true
brainserve.bootstrap.ceo-name=BrainServe CEO
brainserve.bootstrap.ceo-email=manisaran@brainserve.in
brainserve.bootstrap.ceo-password=ManiSaran@BS#id06
brainserve.identity.support-email=support@brainserve.in
# Soft-deleted identity snapshots are retained for compliance. Scheduled closure
# runs in the configured appointment office zone.
brainserve.identity.archive-retention-years=7
brainserve.identity.account-closure-schedule=0 5 0 * * *

# Scalable reporting, history and exports
# Dashboard cache is deliberately capped by code to 1-5 minutes.
brainserve.reporting.dashboard-cache-seconds=180
brainserve.reporting.summary-refresh-ms=60000
brainserve.reporting.history-maintenance-cron=0 15 0 * * *
brainserve.reporting.retention-cron=0 40 2 * * *
brainserve.reporting.partition-archive-enabled=true
brainserve.reporting.partition-archive-cron=0 20 4 * * 0
brainserve.reporting.partition-cleanup-enabled=true
brainserve.reporting.partition-cleanup-cron=0 35 5 * * 0
brainserve.reporting.archive-disposal-cron=0 10 6 * * 0
brainserve.reporting.operational-disposal-cron=0 50 5 * * *
# Comma-separated keyring, for example: v1=<base64-32-byte-key>,v2=<base64-32-byte-key>
# Keep old versions configured until every archive encrypted by them is disposed.
brainserve.reporting.archive-encryption-keys=v1=Q7mK2xN9pL4vR8cT1yH6dF3sW0aB5gJzUeIoXnMqPkA=
brainserve.reporting.archive-encryption-active-key-version=v1
brainserve.reporting.export-retention-days=7
brainserve.reporting.export-max-rows=1000000
brainserve.reporting.export-cleanup-cron=0 10 3 * * *
brainserve.backup.lifecycle-retention-days=35
brainserve.backup.expiry-confirmation-cron=0 45 6 * * *

# Appointment and notification rules
brainserve.appointment.office-zone=Asia/Kolkata
brainserve.appointment.slot-minutes=30
brainserve.appointment.max-advance-days=90
brainserve.appointment.host-sync-ms=60000
# HMAC secret used to sign QR visitor passes. Configure before startup.
brainserve.appointment.qr-signing-secret=BsQrPass-2026-Local-Key-9K4m2P7x8V1c6N5d
# Use a monitored, domain-authenticated mailbox in production.
brainserve.notification.from=support@brainserve.in
brainserve.notification.poll-ms=5000

