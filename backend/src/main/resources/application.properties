# Private document storage and malware scanning
brainserve.document.bucket=brainserve-private
brainserve.document.max-bytes=10485760
brainserve.document.download-url-minutes=5
brainserve.document.clamav-host=localhost
brainserve.document.clamav-port=3310

# Local MinIO storage - no AWS account required
aws.s3.endpoint=http://localhost:9000
aws.s3.public-endpoint=http://localhost:9000
aws.s3.region=ap-south-1
aws.s3.access-key=brainserveadmin
aws.s3.secret-key=BrainServeMinio@2026

# Operations and health endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false

# Logging
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]
